name: Update profile art

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python generate_all.py
        env:
          GITHUB_TOKEN: ${{ secrets.CONTRIB_TOKEN }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile SVGs [skip ci]"
          file_pattern: "banner.svg streak.svg contrib-heatmap.svg avi-ascii.svg info-card.svg"
